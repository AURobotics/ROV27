[workspace]
name = "station"
version = "0.1.0"
readme = "README.md"
platforms = ["linux-64", "win-64", "osx-arm64"]
channels = [
    "https://prefix.dev/robostack-jazzy",
    "https://prefix.dev/conda-forge",
]

[tasks]
console = "python -m console.main"
test = "pytest"

[dependencies]
python = ">=3.11,<3.13"
pyside6 = ">=6.11.0,<7"

[pypi-dependencies]
station = { path = ".", editable = true }
